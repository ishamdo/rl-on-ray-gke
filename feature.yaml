# Showcase feature descriptor — see gke_all /feature.md for the full contract.
name: dolev_rl_ray
title: RL on Ray — GKE L4 GPU
description: >-
  Run a distributed GRPO training loop on Ray and watch KubeRay autoscale GPU
  worker pods across Spot L4 GPU nodes in real time — loss decreasing, accuracy
  scaling up, with a live link to the Ray Dashboard.
gke_features:
  - KubeRay Operator
  - RayCluster GPU Autoscaling
  - Spot GPUs / ComputeClass
  - Distributed RL Training (GRPO)

paths:
  infra_dir: infra
  cluster_dir: cluster
  frontend_dir: frontend
  playroom_slug: ray

# Hub polls this Deployment for readiness
deployment_name: dolev-rl-controller
gateway:
  name: dolev-rl-ray-gw
  class: gke-l7-global-external-managed

build:
  - image: dolev-rl-ray-image
    context: .
    dockerfile: app/Dockerfile

template_vars:
  - NAMESPACE
  - PROJECT_NAME
  - REGION
  - ARTIFACT_REGISTRY_REPO

# Values the Hub does not supply. Standalone defaults; Hub-standard vars win.
template_defaults:
  NAMESPACE: default
  # Image reference assembled from Hub-standard vars; overridable standalone.
  RAY_IMAGE: "${REGION}-docker.pkg.dev/${PROJECT_NAME}/${ARTIFACT_REGISTRY_REPO}/dolev-rl-ray-image:latest"
  # RayCluster worker autoscaling bounds (the live "worker cap").
  WORKER_MIN_REPLICAS: "0"
  WORKER_MAX_REPLICAS: "6"

# This feature's own data-plane router, mounted by the Hub at /api/features/ray.
hub_router: "hub_router:router"

